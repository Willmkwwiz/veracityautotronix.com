<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veracity Autotronix - Battery Finder & Booking</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-amber-500/10 via-slate-900 to-slate-900 border border-amber-500/20 rounded-3xl p-6 shadow-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Area 4, Lilongwe</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-2">Veracity Autotronix</h1>
                <p class="text-slate-400 text-sm">Willard Battery Center — Find your battery & book expert services.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('finder')" id="btn-finder" class="px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-955 transition shadow-lg shadow-amber-500/20">Battery Finder</button>
                <button onclick="switchTab('booking')" id="btn-booking" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Book Service</button>
            </div>
        </div>

        <!-- TAB 1: BATTERY FINDER -->
        <div id="tab-finder" class="space-y-6">
            <!-- Filter Bar -->
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Filter by Application</label>
                    <select id="filter-app" onchange="filterBatteries()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="">All Applications</option>
                        <option value="Automotive">Automotive</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Motorcycle">Motorcycle</option>
                        <option value="Solar/Deep Cycle">Solar / Deep Cycle</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Search Model / Brand</label>
                    <input type="text" id="filter-search" oninput="filterBatteries()" placeholder="e.g. Willard, 619, YTX9..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <!-- Battery Product Grid -->
            <div id="battery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- TAB 2: SERVICE BOOKING -->
        <div id="tab-booking" class="hidden bg-slate-900/80 border border-slate-800 p-6 rounded-3xl space-y-4">
            <h2 class="text-xl font-bold text-white">Book Battery Testing or Fitment</h2>
            <p class="text-sm text-slate-400">Fill in your details and our Area 4 team will get back to you instantly.</p>
            
            <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Name</label>
                        <input type="text" id="b-name" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="William Mkwamba">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Phone Number</label>
                        <input type="tel" id="b-phone" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="+265 ...">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Vehicle Model / Type</label>
                        <input type="text" id="b-vehicle" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="e.g. Toyota Hilux">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Service Type</label>
                        <select id="b-service" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="New Battery Fitment">New Battery Fitment</option>
                            <option value="Battery Testing & Diagnostics">Battery Testing & Diagnostics</option>
                            <option value="Battery Charging">Battery Charging</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Preferred Date</label>
                    <input type="date" id="b-date" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">
                    Submit Booking Request
                </button>
            </form>
            <div id="form-message" class="hidden text-sm p-3 rounded-xl text-center"></div>
        </div>

    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        // ==========================================================
        // 1. SUPABASE CONFIGURATION (Replace with your actual keys)
        // ==========================================================
        const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';

        // Check for URL parameters if embedded via iframe query strings
        const urlParams = new URLSearchParams(window.location.search);
        const activeUrl = urlParams.get('spUrl') || SUPABASE_URL;
        const activeKey = urlParams.get('spKey') || SUPABASE_ANON_KEY;

        let supabaseClient = null;
        if (activeUrl && activeKey && !activeUrl.includes('YOUR-PROJECT')) {
            supabaseClient = supabase.createClient(activeUrl, activeKey);
        }

        // Fallback demo data if Supabase isn't connected yet
        const fallbackBatteries = [
            { id: 1, brand: 'Willard', model_code: '619 / 628 (60Ah)', capacity_ah: 60, application_type: 'Automotive', in_stock: true },
            { id: 2, brand: 'Willard', model_code: '652 (70Ah)', capacity_ah: 70, application_type: 'Automotive', in_stock: true },
            { id: 3, brand: 'SABAT', model_code: '638 (45Ah)', capacity_ah: 45, application_type: 'Automotive', in_stock: true },
            { id: 4, brand: 'GP', model_code: 'YTX9-BS', capacity_ah: 9, application_type: 'Motorcycle', in_stock: true },
            { id: 5, brand: 'Toplite', model_code: '12V 100Ah Solar', capacity_ah: 100, application_type: 'Solar/Deep Cycle', in_stock: true }
        ];

        let batteriesData = [];

        // Tab Switching Logic
        function switchTab(tab) {
            if (tab === 'finder') {
                document.getElementById('tab-finder').classList.remove('hidden');
                document.getElementById('tab-booking').classList.add('hidden');
                document.getElementById('btn-finder').className = 'px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-955 shadow-lg shadow-amber-500/20';
                document.getElementById('btn-booking').className = 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            } else {
                document.getElementById('tab-finder').classList.add('hidden');
                document.getElementById('tab-booking').classList.remove('hidden');
                document.getElementById('btn-booking').className = 'px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-955 shadow-lg shadow-amber-500/20';
                document.getElementById('btn-finder').className = 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            }
        }

        // Fetch Batteries from Supabase or Fallback
        async function loadBatteries() {
            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('batteries').select('*');
                if (!error && data && data.length > 0) {
                    batteriesData = data;
                } else {
                    batteriesData = fallbackBatteries;
                }
            } else {
                batteriesData = fallbackBatteries;
            }
            renderBatteries(batteriesData);
        }

        // Render Battery Cards
        function renderBatteries(items) {
            const grid = document.getElementById('battery-grid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-sm">No batteries match your criteria.</div>`;
                return;
            }

            items.forEach(bat => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 hover:border-amber-500/50 transition rounded-2xl p-4 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg">${bat.brand}</span>
                                <span class="text-xs px-2 py-0.5 rounded-full ${bat.in_stock ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                                    ${bat.in_stock ? 'In Stock' : 'Out of Stock'}
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-white mt-2">${bat.model_code}</h3>
                            <p class="text-xs text-slate-400 mt-1">Application: <strong>${bat.application_type}</strong></p>
                            ${bat.capacity_ah ? `<p class="text-
